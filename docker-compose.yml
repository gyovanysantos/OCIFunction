# ──────────────────────────────────────────────────────────────
# JDE Integrity Analyzer — Local Development Stack
# ──────────────────────────────────────────────────────────────
# 2 services: MCP server + API (agents run in-process via OCI ADK)
#
# Usage:
#   docker compose up --build          # build & start both
#   docker compose up --build api      # rebuild & start API only (+ MCP dep)
#   docker compose up mcp              # start MCP server only
#   docker compose logs -f api         # follow API logs
#
# Ports:
#   MCP Server:     http://localhost:3000  (health: /health, mcp: /mcp)
#   API Wrapper:    http://localhost:8080  (JDE Orchestration: /v1/analyze)
# ──────────────────────────────────────────────────────────────

services:
  # ── JDE MCP Server (TypeScript / Node.js 22) ────────────────
  mcp:
    build:
      context: ./jde-mcp-server-template
      dockerfile: Dockerfile
    container_name: jde-mcp-server
    ports:
      - "3000:3000"
    environment:
      TRANSPORT: http
      PORT: "3000"
      JDE_AIS_URL: ${JDE_AIS_URL}
      JDE_USERNAME: ${JDE_USERNAME}
      JDE_PASSWORD: ${JDE_PASSWORD}
      JDE_ENVIRONMENT: ${JDE_ENVIRONMENT:-JDV920}
      JDE_ROLE: ${JDE_ROLE:-*ALL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ── API + Agents (Python — OCI ADK deterministic workflow) ──
  # Runs ExtractorAgent + AnalyzerAgent IN-PROCESS via OCI ADK
  # Returns {checkerResponse, analysisResponse} for JDE Orchestration
  api:
    build:
      context: ./agents
      dockerfile: Dockerfile.api
    container_name: jde-api
    ports:
      - "8080:8080"
    environment:
      # OCI ADK auth (api_key reads ~/.oci/config)
      OCI_AUTH_TYPE: ${OCI_AUTH_TYPE:-api_key}
      OCI_REGION: ${OCI_REGION:-us-phoenix-1}
      OCI_PROFILE: ${OCI_PROFILE:-DEFAULT}
      # Agent endpoint OCIDs (from OCI Console → GenAI Agents)
      EXTRACTOR_AGENT_ENDPOINT_ID: ${EXTRACTOR_AGENT_ENDPOINT_ID}
      ANALYZER_AGENT_ENDPOINT_ID: ${ANALYZER_AGENT_ENDPOINT_ID}
      # OCI Object Storage (PDF downloads)
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME:-agent-knowledge-base}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-axzkbtajofjq}
      # MCP server URL (Docker internal network)
      MCP_SERVER_URL: http://mcp:3000/mcp
      # ADK debug logging (set to DEBUG for tool traces)
      ADK_LOG_LEVEL: ${ADK_LOG_LEVEL:-INFO}
    volumes:
      # Mount OCI config for auth + PDF downloads (local dev only)
      - ${USERPROFILE}/.oci:/root/.oci:ro
    depends_on:
      mcp:
        condition: service_healthy
    restart: unless-stopped
