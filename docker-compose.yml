# ──────────────────────────────────────────────────────────────
# JDE Integrity Analyzer — Local Development Stack
# ──────────────────────────────────────────────────────────────
# 4 services: MCP server, ExtractorAgent, AnalyzerAgent, API
#
# Usage:
#   docker compose up --build          # build & start all 4
#   docker compose up --build api      # rebuild & start API only (+ MCP dep)
#   docker compose up mcp              # start MCP server only
#   docker compose logs -f api         # follow API logs
#
# Ports:
#   MCP Server:     http://localhost:3000  (health: /health, mcp: /mcp)
#   ExtractorAgent: http://localhost:8088  (Foundry /responses API)
#   AnalyzerAgent:  http://localhost:8089  (Foundry /responses API)
#   API Wrapper:    http://localhost:8080  (JDE Orchestration: /v1/analyze)
# ──────────────────────────────────────────────────────────────

services:
  # ── JDE MCP Server (TypeScript / Node.js 22) ────────────────
  mcp:
    build:
      context: ./jde-mcp-server-template
      dockerfile: Dockerfile
    container_name: jde-mcp-server
    ports:
      - "3000:3000"
    environment:
      TRANSPORT: http
      PORT: "3000"
      JDE_AIS_URL: ${JDE_AIS_URL}
      JDE_USERNAME: ${JDE_USERNAME}
      JDE_PASSWORD: ${JDE_PASSWORD}
      JDE_ENVIRONMENT: ${JDE_ENVIRONMENT:-JDV920}
      JDE_ROLE: ${JDE_ROLE:-*ALL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ── ExtractorAgent (Python — PDF download + text extraction) ─
  extractor:
    build:
      context: ./agents/extractor
      dockerfile: Dockerfile
    container_name: jde-extractor-agent
    ports:
      - "8088:8088"
    environment:
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
      FOUNDRY_MODEL_DEPLOYMENT_NAME: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
      FOUNDRY_TOKEN: ${FOUNDRY_TOKEN:-}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME:-OBJECTSTORAGE}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-idxoqn0ijjyv}
    volumes:
      # Mount OCI config for PDF downloads (local dev only)
      # Use USERPROFILE on Windows (HOME is not set)
      - ${USERPROFILE}/.oci:/root/.oci:ro
    restart: unless-stopped

  # ── AnalyzerAgent (Python — MCP-powered JDE cross-reference) ─
  analyzer:
    build:
      context: ./agents/analyzer
      dockerfile: Dockerfile
    container_name: jde-analyzer-agent
    ports:
      - "8089:8088"
    environment:
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
      FOUNDRY_MODEL_DEPLOYMENT_NAME: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
      FOUNDRY_TOKEN: ${FOUNDRY_TOKEN:-}
      # Points to the MCP container via Docker network
      MCP_SERVER_URL: http://mcp:3000/mcp
    depends_on:
      mcp:
        condition: service_healthy
    restart: unless-stopped

  # ── API Wrapper (Python — JDE Orchestration endpoint) ────────
  # Runs both agents IN-PROCESS; returns {checkerResponse, analysisResponse}
  api:
    build:
      context: ./agents
      dockerfile: Dockerfile.api
    container_name: jde-api
    ports:
      - "8080:8080"
    environment:
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
      FOUNDRY_MODEL_DEPLOYMENT_NAME: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
      FOUNDRY_TOKEN: ${FOUNDRY_TOKEN:-}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME:-OBJECTSTORAGE}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-idxoqn0ijjyv}
      MCP_SERVER_URL: http://mcp:3000/mcp
    volumes:
      - ${USERPROFILE}/.oci:/root/.oci:ro
    depends_on:
      mcp:
        condition: service_healthy
    restart: unless-stopped
