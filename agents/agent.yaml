$schema: https://schema.mp.microsoft.com/agentic/v1/hosted-agent.json
name: jde-integrity-analyzer
description: >
  Multi-agent workflow that analyzes JDE Integrity Reports (R047001A).
  ExtractorAgent downloads PDF from OCI Object Storage and extracts structured data.
  AnalyzerAgent cross-references findings against live JDE data via MCP tools.
version: 1.0.0
kind: hosted
protocols:
  - responses/v1
environment:
  FOUNDRY_PROJECT_ENDPOINT: ""
  FOUNDRY_MODEL_DEPLOYMENT_NAME: ""
  MCP_SERVER_URL: ""
  OCI_BUCKET_NAME: "agent-knowledge-base"
  OCI_NAMESPACE: "axzkbtajofjq"
